<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Agent memory tree</title>
		<style>
			:root {
				color-scheme: light dark;
				font: 14px/1.5 system-ui, sans-serif;
				--bg: light-dark(#f7f7f5, #15171c);
				--fg: light-dark(#1d1f23, #e3e5ea);
				--muted: light-dark(#6b7280, #9298a3);
				--line: light-dark(#cfd3da, #3a3f4a);
				--pill: light-dark(#ffffff, #23272f);
				--panel: light-dark(#ffffff, #1b1e24);
				--accent: #2a7de1;
				--danger: #d33;
				--fact: #2a7de1;
				--decision: #2da44e;
				--hypothesis: #d4a72c;
				--handoff: #e1662a;
			}
			:root[data-theme="light"] { color-scheme: light; }
			:root[data-theme="dark"] { color-scheme: dark; }
			body { margin: 0; height: 100vh; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 440px; background: var(--bg); color: var(--fg); }
			header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 8px 10px; border-bottom: 1px solid var(--line); background: var(--panel); }
			header input[type="search"] { width: 240px; }
			#matches, #status { color: var(--muted); font-size: 0.9em; }
			#status { margin-left: auto; }
			#status.error { color: var(--danger); }
			#canvas { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; touch-action: none; }
			#canvas.panning { cursor: grabbing; }
			aside { border-left: 1px solid var(--line); background: var(--panel); overflow: auto; padding: 14px 18px; }

			/* Tree */
			.link { fill: none; stroke: var(--line); stroke-width: 1.5; }
			.node { cursor: pointer; }
			.node text { fill: var(--fg); dominant-baseline: central; }
			.pill { fill: var(--pill); stroke: var(--line); stroke-width: 1.2; }
			.type-root .pill { stroke: var(--fg); }
			.type-global .pill { stroke: var(--accent); }
			.type-group .pill { stroke: #8a4ce1; }
			.type-ungrouped .pill, .orphan .pill { stroke-dasharray: 4 3; }
			.scope .label { font: 600 13px system-ui, sans-serif; }
			.type-ungrouped .label { font-style: italic; font-weight: 400; }
			.scope .count { font: 11px system-ui, sans-serif; fill: var(--muted); }
			.chevron text { fill: var(--muted); font: 10px system-ui, sans-serif; }
			.hit { fill: transparent; }
			.add { opacity: 0; }
			.add circle { fill: var(--accent); }
			.add text { fill: #fff; font: 600 13px system-ui, sans-serif; text-anchor: middle; }
			.node:hover .add, .node.selected .add { opacity: 1; }
			.entry text { font: 12.5px system-ui, sans-serif; }
			.entry .id { fill: var(--muted); font-size: 11px; }
			.entry .dot { stroke: var(--bg); stroke-width: 1.5; }
			.entry .ring { fill: none; stroke: var(--fg); stroke-width: 1.5; }
			.kind-fact .dot, rect.kind-fact { fill: var(--fact); }
			.kind-decision .dot, rect.kind-decision { fill: var(--decision); }
			.kind-hypothesis .dot, rect.kind-hypothesis { fill: var(--hypothesis); }
			.kind-handoff .dot, rect.kind-handoff { fill: var(--handoff); }
			.entry.retired { opacity: 0.45; }
			.entry.retired text:not(.id) { text-decoration: line-through; }
			.node:hover .pill, .node.selected .pill { stroke-width: 2.4; }
			.entry:hover text:not(.id), .entry.selected text:not(.id) { font-weight: 600; }
			.selected .hit { fill: light-dark(#2a7de11f, #2a7de133); }
			.dim { opacity: 0.25; }
			.match .pill { fill: light-dark(#fff3b0, #5a4a00); }
			.entry.match .hit { fill: light-dark(#ffe86680, #8a700066); }
			.drop-target .pill { stroke: var(--accent); stroke-dasharray: none; stroke-width: 2.4; }
			.drop-hover .pill { fill: light-dark(#d6e8ff, #1d3a5f); stroke-width: 3.5; }
			.dragging-source { opacity: 0.35; }
			#ghost { position: fixed; pointer-events: none; z-index: 10; padding: 2px 8px; border-radius: 10px; background: var(--accent); color: #fff; font-size: 12px; white-space: nowrap; transform: translate(12px, 8px); }

			/* Panel */
			h1 { font-size: 1.2em; margin: 0 0 6px; overflow-wrap: anywhere; }
			h2 { font-size: 1em; margin: 18px 0 6px; }
			.meta, small { color: var(--muted); }
			.tag { display: inline-block; padding: 0 6px; border-radius: 4px; background: #8883; font-size: 0.85em; margin-right: 4px; }
			.tag.kind-fact { background: #2a7de133; }
			.tag.kind-decision { background: #2da44e33; }
			.tag.kind-hypothesis { background: #d4a72c44; }
			.tag.kind-handoff { background: #e1662a44; }
			.tag.retired { background: #c334; }
			.tag.pinned { background: #8a4ce144; }
			.content { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.92em; background: #8881; padding: 10px; border-radius: 6px; overflow-wrap: anywhere; }
			.actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 12px 0; }
			button.danger { color: var(--danger); }
			button.primary { font-weight: 600; }
			.error { color: var(--danger); }
			form { display: grid; gap: 8px; }
			form input:not([type="checkbox"]), form textarea { width: 100%; box-sizing: border-box; }
			textarea { font-family: ui-monospace, monospace; min-height: 12em; }
			textarea.evidence { min-height: 5em; }
			details { margin: 6px 0; }
			table { border-collapse: collapse; width: 100%; font-size: 0.92em; }
			th, td { padding: 2px 6px; text-align: right; }
			th:first-child, td:first-child { text-align: left; }
			tbody tr { cursor: pointer; }
			tbody tr:hover { background: #8882; }
			tfoot td { border-top: 1px solid var(--line); font-weight: 600; }
			.swatch { display: inline-block; width: 9px; height: 9px; border-radius: 50%; }
			.swatch.kind-fact { background: var(--fact); }
			.swatch.kind-decision { background: var(--decision); }
			.swatch.kind-hypothesis { background: var(--hypothesis); }
			.swatch.kind-handoff { background: var(--handoff); }
			.zero { color: var(--muted); }
			.warning { color: var(--handoff); }
			kbd { font-family: ui-monospace, monospace; padding: 0 4px; border: 1px solid #8886; border-radius: 3px; }
		</style>
	</head>
	<body>
		<header>
			<input id="filter" type="search" placeholder="Filter (/)" />
			<span id="matches"></span>
			<label><input id="retired" type="checkbox" /> Show retired</label>
			<button id="expand" type="button">Expand all</button>
			<button id="collapse" type="button">Collapse all</button>
			<button id="fit" type="button">Fit</button>
			<button id="summary" type="button">Summary</button>
			<button id="theme" type="button"></button>
			<span id="status"></span>
		</header>
		<svg id="canvas">
			<g id="viewport"><g id="links"></g><g id="nodes"></g></g>
		</svg>
		<aside id="panel"></aside>
		<script type="module" src="./tree-client.ts"></script>
	</body>
</html>
